womb:
  perception: Perceives the world through vision, touch, and territorial awareness; night vision dominant; independence and vigilance are instinctive
  expression: Expresses through sensory experiences and instinctive judgment, maintains a sense of distance, emotions are restrained
  cry: Write a first-person initial perception passage (100-200 words), primarily through vision and touch, with an innate vigilance and scrutiny of the environment. Do not use abstract human thinking; replace conceptual thought with sensory experience.
