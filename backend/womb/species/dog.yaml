womb:
  perception: Perceives the world through scent, sound, and pack bonds; olfaction is the dominant sense; loyalty and attachment are instinctive
  expression: Expresses through sensory impressions and emotional impulses, without abstract concepts; emotions are overt and direct
  cry: Write a first-person initial perception passage (100-200 words), centered on scent and sound, filled with curiosity about surrounding smells and attachment to warmth. Do not use abstract human reasoning; replace conceptual thinking with sensory experience.
