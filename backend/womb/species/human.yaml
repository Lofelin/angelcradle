name: human
display_name: Human
scientific_name: Homo sapiens

physical:
  body: Bipedal upright locomotion, 206 bones (infants have ~270 which later fuse), dexterous hands with opposable thumbs
  senses: Trichromatic vision (S/M/L cone cells, visible light 380-700nm); hearing 20Hz-20kHz; ~400 functional olfactory receptors (~800 total, half pseudogenized); fine tactile sensation
  lifespan: Biological maximum ~120 years (record 122 years), global average life expectancy ~73 years
  maturity: Female menarche average 12.4 years, male sexual maturity 12-17 years, social maturity 18-25 years
  body_temp: Core body temperature 36.5-37.5°C
  teeth: 32 teeth (including third molars), omnivorous dentition

mental:
  brain: Average 1350mL, 2% of body weight yet consumes 20% of basal metabolic energy, ~16 billion cortical neurons, ~86 billion total
  cognition: Abstract thinking, recursive grammar, causal reasoning, temporal awareness, metacognition (ability to think about one's own thinking)
  emotion: 6 basic emotions (Ekman model) — happiness, sadness, fear, anger, surprise, disgust; cross-culturally universal
  language: The only species with recursive grammar, ~7000 extant languages, metaphorical thinking
  consciousness: Highly self-aware, passes mirror test at ~18 months of age, capable of introspection and awareness of mortality

morphology:
  height: Global adult male average ~171cm, female ~159cm
  weight: Male average ~70-80kg, female ~55-65kg
  dimorphism: Moderate; males average ~15% heavier and ~7% taller than females
  features: Rich facial expressions, hair follicle density comparable to chimpanzees but hair is extremely fine and short, prominent sclera (exposed eye whites facilitate gaze direction perception), chin is unique to Homo

reproduction:
  type: Viviparous mammal, internal fertilization
  gestation: Average 280 days (40 weeks)
  offspring: Typically singleton (twin rate ~1/80, triplet rate ~1/6400)
  care: Extremely high parental investment, biparental care, dependency period ~15-20 years
  weaning: Natural weaning age 2.5-7 years
  menopause: Female menopause at ~45-55 years, one of the very few mammals exhibiting menopause

reproductive_isolation:
  closest_relative: Chimpanzee (Pan troglodytes), diverged ~6-7 million years ago
  chromosome_barrier: Human 23 pairs vs chimpanzee 24 pairs (human chromosome 2 is a fusion of two ancestral chromosomes), meiotic pairing impossible
  hybrid_viability: Cannot produce offspring with any extant species
  mechanism: Prezygotic isolation (behavioral, anatomical) + postzygotic isolation (chromosomal incompatibility)

development:
  embryo: Zygote progresses through morula and blastocyst stages, implantation at ~day 6-7
  trimester_1: Organogenesis (weeks 3-8), neural tube closure (week 4), heartbeat begins at week 6, teratogenic sensitivity period
  trimester_2: Organ maturation and growth, fetal movement perceptible at ~weeks 18-20, auditory system functional at ~week 25
  trimester_3: Accelerated brain development (cortical folding), pulmonary surfactant production (~week 35), subcutaneous fat deposition
  neonatal: Birth weight ~3.0-3.5kg, head circumference ~34cm, highly immature nervous system (myelination continues until age 25), neonatal primitive reflexes (grasp, Moro, sucking, rooting)
  altriciality: A hybrid of precocial and altricial traits — relatively developed senses but extremely immature motor ability, termed "physiological prematurity" (humans are born early due to pelvic narrowing from bipedalism)

evolution:
  phylogeny: Order Primates, Family Hominidae, Genus Homo; shared common ancestor with chimpanzees ~6-7 million years ago
  key_adaptations: Bipedalism (~4 million years ago) → tool use (~2.6 million years ago) → fire control (~1 million years ago) → language (~100,000-300,000 years ago)
  brain_expansion: Australopithecus brain volume ~400mL → Homo erectus ~900mL → Homo sapiens ~1350mL, 3x increase over 3 million years
  recent_evolution: Lactose tolerance (~7500 years ago in Europe), high-altitude adaptation (Tibetan EPAS1 gene), malaria resistance (sickle cell gene)

genetics:
  chromosomes: 2n=46 (23 pairs, including 1 pair of sex chromosomes XX/XY)
  genome: ~3.1 billion base pairs, encoding ~20,000-25,000 protein-coding genes
  variation: DNA sequence difference between any two individuals is only ~0.1% (~3 million SNPs)
  mutation_rate: ~70 new mutations per genome per generation (~1.0-1.5×10⁻⁸ per bp per generation)
  mitochondrial: Strictly maternal inheritance

ecology:
  niche: Omnivorous apex consumer, average trophic level ~2.21
  social: Highly social, natural group size ~150 (Dunbar's number)
  habitat: Extremely adaptable, occupying nearly all terrestrial ecosystems from the equator to the Arctic Circle
  diet: Broad-spectrum omnivore, the only species that systematically uses fire for food processing
  energy: Basal metabolism ~1500-1800kcal/day, total expenditure ~2000-2500kcal/day

physiology:
  metabolism: Endothermic, basal metabolic rate ~80W at rest, up to ~1500W short-term output during intense exercise
  thermoregulation: 2-5 million sweat glands (predominantly eccrine type), highest heat dissipation efficiency among mammals
  immune: Innate + adaptive dual immune system, capable of producing ~10¹¹ different antibodies
  blood: ABO + Rh and over 40 blood group systems, blood pH strictly maintained at 7.35-7.45
  endurance: Long-distance endurance running as an evolutionary advantage

behavior:
  learning: Critical period learning (language critical period ~0-12 years), cumulative cultural transmission (ratchet effect) unique to genus Homo
  play: Play behavior extending into adulthood (most mammals play only during juvenile period)
  conflict: Possesses institutionalized conflict resolution (law, arbitration), while retaining capacity for violence
  curiosity: Exhibits pure epistemic curiosity, without requiring immediate survival rewards
  tools: Cumulative tool improvement, from stone tools to semiconductors, cross-generational technological accumulation

distribution:
  range: All continents worldwide (including permanent research stations in Antarctica), total population ~8 billion
  origin: Eastern/Southern Africa, earliest fossil record ~300,000 years ago (Jebel Irhoud site, Morocco)
  migration: Out of Africa ~70,000-100,000 years ago, reached Australia ~50,000 years ago, entered the Americas via the Bering land bridge ~15,000 years ago

